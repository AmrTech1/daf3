<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>لم تتم عملية الدفع | المتجر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="failed">

  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="index.html">صدى</a>
    </div>
  </header>

  <main class="container result">
    <section class="result__card result__card--fail">
      <div class="result__icon result__icon--fail" aria-hidden="true">!</div>
      <h1>لم تتم عملية الدفع</h1>
      <p id="fail-message">لم يتم خصم أي مبلغ من حسابك. يمكنك المحاولة مرة أخرى أو استخدام وسيلة دفع مختلفة.</p>

      <div class="result__actions">
        <a class="btn btn--primary" href="index.html?retry=1">إعادة المحاولة</a>
        <a class="btn btn--ghost" href="index.html">العودة للمتجر</a>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
